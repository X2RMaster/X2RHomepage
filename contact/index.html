  <style>
    :root {
      --brand: #00a9e0;
      --ink: #2e3a45;
      --text: #1f2933;
      --muted: #8a96a3;
      --line: #edf1f5;
      --bg: #f4f7fa;
      --card: #ffffff;
      --radius: 28px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR",
        "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background:
        radial-gradient(600px 400px at 15% -10%, rgba(0, 169, 224, 0.14), transparent 70%),
        radial-gradient(500px 360px at 110% 110%, rgba(46, 58, 69, 0.08), transparent 70%),
        var(--bg);
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow:
        0 1px 2px rgba(16, 24, 40, 0.04),
        0 24px 60px -12px rgba(16, 24, 40, 0.14);
      overflow: hidden;
      animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .hero {
      padding: 20px 28px 8px;
      text-align: center;
    }

    .logo {
      width: 220px;
      height: 220px;
      display: block;
      margin: 0 auto;
    }

    .links {
      list-style: none;
      margin: 0;
      padding: 0 16px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 12px;
      border-radius: 16px;
      color: inherit;
      text-decoration: none;
      transition: background 0.18s ease, transform 0.18s ease;
    }

    .links li + li .link { border-top: 1px solid var(--line); }
    .links li:hover + li .link,
    .links li:hover .link { border-color: transparent; }

    .link:hover { background: #f6f9fb; }
    .link:active { transform: scale(0.99); }

    .ico {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: #fff;
      border: 1px solid var(--line);
    }

    .ico svg { width: 22px; height: 22px; display: block; }
    .ico.line svg { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .meta { flex: 1; min-width: 0; }
    .meta > span { display: block; }

    .label {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.02em;
      margin-bottom: 2px;
    }

    .value {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chev {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      fill: none;
      stroke: #c3ccd5;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .foot { padding: 20px 28px 28px; }

    .save {
      width: 100%;
      height: 54px;
      border: 0;
      border-radius: 16px;
      background: var(--ink);
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 10px 24px -8px rgba(46, 58, 69, 0.55);
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .save:hover { background: #24303a; transform: translateY(-1px); }
    .save:active { transform: translateY(0); }
    .save svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
    }

    @media (max-width: 380px) {
      .hero { padding: 12px 20px 4px; }
      .logo { width: 190px; height: 190px; }
      .links { padding: 0 8px; }
      .foot { padding: 16px 20px 22px; }
    }
  </style>
</head>
