<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X2R Projects</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        /* ================= 1. 기본 스타일 ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
            color: #ffffff; overflow-x: hidden; background-color: transparent; line-height: 1.6;
        }
        a { text-decoration: none; color: inherit; transition: all 0.3s; }
        button { cursor: pointer; font-family: inherit; }

        /* 배경 및 헤더 */
        .video-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .video-background iframe { width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 0; }
        
        header { position: fixed; top: 0; width: 100%; z-index: 100; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { display: flex; align-items: center; max-width: 150px; height: auto; }
        .logo img { width: 100%; height: auto; }
        .nav-links a { margin-left: 30px; font-size: 0.95rem; font-weight: 500; color: #bbb; }
        .nav-links a.active { color: #fff; font-weight: 700; }
        .nav-links a:hover { color: #fff; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .page-header { padding: 150px 0 80px; text-align: center; }
        .page-title { font-size: clamp(2.5rem, 5vw, 4.5rem); font-weight: 800; margin-bottom: 20px; animation: slideUp 1s ease-out forwards; }
        .page-desc { font-size: 1.2rem; color: #ccc; max-width: 700px; margin: 0 auto; animation: slideUp 1s ease-out 0.2s forwards; opacity: 0; }

        /* ================= 2. 카드 그리드 ================= */
        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 40px; padding-bottom: 150px; }
        .project-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; overflow: hidden; transition: transform 0.4s, box-shadow 0.4s; backdrop-filter: blur(5px); opacity: 0; transform: translateY(30px); animation: fadeInCard 0.8s ease-out forwards; }
        @keyframes fadeInCard { to { opacity: 1; transform: translateY(0); } }
        .project-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); border-color: rgba(59, 130, 246, 0.5); }
        
        .card-image { height: 220px; overflow: hidden; position: relative; z-index: 1; }
        .card-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s, filter 0.3s; }
        .project-card:hover .card-image img { transform: scale(1.1); filter: brightness(0.7); }
        .play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5); font-size: 3rem; color: #fff; opacity: 0; transition: all 0.3s; z-index: 2; text-shadow: 0 2px 10px rgba(0,0,0,0.5); pointer-events: none; }
        .card-image:hover .play-icon { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .category-tag { position: absolute; top: 15px; left: 15px; background: rgba(0, 0, 0, 0.7); padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; color: #3b82f6; backdrop-filter: blur(4px); z-index: 5; }

        .card-content { padding: 25px; display: flex; flex-direction: column; height: calc(100% - 220px); }
        .card-content h3 { font-size: 1.3rem; margin-bottom: 10px; font-weight: 700; line-height: 1.3; }
        .card-content p { font-size: 0.95rem; color: #aaa; margin-bottom: 20px; flex-grow: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .card-link { font-size: 0.9rem; font-weight: 600; color: #fff; background: transparent; border: none; padding: 0; display: inline-flex; align-items: center; margin-top: auto; }
        .card-link::after { content: '→'; margin-left: 8px; transition: margin-left 0.3s; }
        .project-card:hover .card-link::after { margin-left: 12px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* ================= 3. 상세 정보 모달 (업그레이드) ================= */
        .game-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); z-index: 1000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease; }
        .game-modal.show { display: flex; opacity: 1; }

        /* 모달 박스 */
        .modal-content {
            position: relative; width: 90%; max-width: 1200px; height: 90vh;
            background: #111; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; /* 모달 자체도 좀 더 둥글게 수정 */
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; overflow: hidden;
        }

        .modal-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; border-bottom: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
        .modal-title-text { font-size: 1.2rem; font-weight: 700; color: #fff; }
        .close-modal { background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer; line-height: 1; transition: color 0.3s; }
        .close-modal:hover { color: #ff4d4d; }

        /* 스크롤 가능한 본문 영역 */
        .modal-body { flex-grow: 1; overflow-y: auto; padding: 0; }

        /* 게임/영상 영역 (16:9 비율 유지) 및 둥근 테두리 적용 */
        .iframe-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            border-radius: 12px; /* 테두리 둥글게 */
            overflow: hidden;    /* 둥근 영역 밖으로 나가는 내용 숨김 */
            border-bottom: 1px solid rgba(255,255,255,0.1); /* 하단 경계선 추가 */
        }
        .game-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* 설명 및 이미지 영역 */
        .detail-info { padding: 40px; }
        .detail-desc { font-size: 1rem; line-height: 1.8; color: #ddd; margin-bottom: 40px; white-space: pre-line; }
        .detail-desc h3 { color: #3b82f6; margin-bottom: 15px; font-size: 1.5rem; }

        /* 이미지 갤러리 그리드 */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .gallery-item { width: 100%; border-radius: 12px; /* 갤러리 이미지도 둥글게 */ border: 1px solid rgba(255,255,255,0.1); transition: transform 0.3s; }
        .gallery-item:hover { transform: scale(1.02); }

        /* 모바일 대응 */
        @media (max-width: 768px) {
            .project-grid { grid-template-columns: 1fr; }
            .modal-content { width: 100%; height: 100%; border-radius: 0; }
            .iframe-container { border-radius: 0; } /* 모바일 전체화면 시엔 둥근 효과 제거 */
            .detail-info { padding: 20px; }
            .gallery-grid { grid-template-columns: 1fr; }
        }
        
        footer { padding: 60px 0; text-align: center; color: #555; border-top: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <div class="video-background">
        <iframe src="https://www.youtube.com/embed/mwyfdKKhhAk?autoplay=1&mute=1&controls=0&loop=1&playlist=mwyfdKKhhAk&playsinline=1" title="Background Video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" style="pointer-events: none;" allowfullscreen></iframe>
        <div class="overlay"></div>
    </div>

    <header>
        <a href="index.html" class="logo"><img src="x2rlogo.png" alt="X2R Logo"></a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="history.html">History</a>
            <a href="projects.html" class="active">Projects</a> 
        </nav>
    </header>

    <section class="container page-header">
        <h1 class="page-title">X2R Projects</h1>
        <p class="page-desc">총 <span id="project-count">0</span>개의 혁신적인 프로젝트.<br>데이터 기반으로 자동 업데이트되는 X2R의 포트폴리오입니다.</p>
    </section>

    <section class="container project-grid" id="project-container">
        <div style="text-align:center; width:100%; grid-column: 1/-1; color: #aaa;">Loading Projects...</div>
    </section>

    <footer><p>© 2025 X2R Corp. All Rights Reserved.</p></footer>

    <div id="gameModal" class="game-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitleDisplay" class="modal-title-text">Project Detail</span>
                <button class="close-modal" onclick="closeModal()">×</button>
            </div>
            
            <div class="modal-body">
                <div class="iframe-container">
                    <iframe id="gameFrame" class="game-frame" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
                </div>

                <div class="detail-info">
                    <div class="detail-desc">
                        <h3>Project Overview</h3>
                        <p id="modalLongDesc">상세 설명이 로딩 중입니다...</p>
                    </div>
                    
                    <div class="detail-desc" id="gallerySection" style="display:none;">
                        <h3>Gallery</h3>
                        <div id="modalGallery" class="gallery-grid"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allProjects = [];
        const modal = document.getElementById('gameModal');
        const gameFrame = document.getElementById('gameFrame');
        const modalTitle = document.getElementById('modalTitleDisplay');
        const modalDesc = document.getElementById('modalLongDesc');
        const modalGallery = document.getElementById('modalGallery');
        const gallerySection = document.getElementById('gallerySection');

        function openDetail(index) {
            const data = allProjects[index];
            if (!data) return;

            modalTitle.innerText = data['Project Name'];
            const webglLink = data['WebGL Link'];
            const videoLink = data['Video Link'];

            if (webglLink && webglLink.trim() !== "") {
                gameFrame.src = webglLink;
            } else if (videoLink && videoLink.trim() !== "") {
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
                const match = videoLink.match(regExp);
                if (match && match[2].length === 11) {
                    gameFrame.src = `https://www.youtube.com/embed/${match[2]}?autoplay=1`;
                }
            } else {
                gameFrame.src = "";
            }

            const longDesc = data['Long Description'] || data['Short Description'];
            modalDesc.innerHTML = longDesc;

            modalGallery.innerHTML = "";
            const imagesStr = data['Detail Images'];
            if (imagesStr && imagesStr.trim() !== "") {
                gallerySection.style.display = "block";
                const images = imagesStr.split(',');
                images.forEach(imgUrl => {
                    const cleanUrl = fixWixImage(imgUrl.trim());
                    if (cleanUrl) {
                        const imgTag = document.createElement("img");
                        imgTag.src = cleanUrl;
                        imgTag.className = "gallery-item";
                        imgTag.loading = "lazy";
                        modalGallery.appendChild(imgTag);
                    }
                });
            } else {
                gallerySection.style.display = "none";
            }

            modal.classList.add('show');
            document.body.style.overflow = 'hidden'; 
        }

        function openYoutubePopup(url) {
            if (!url) return;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            if (match && match[2].length === 11) {
                modalTitle.innerText = "Video Preview";
                gameFrame.src = `https://www.youtube.com/embed/${match[2]}?autoplay=1`;
                modalDesc.innerHTML = "영상 미리보기 모드입니다.";
                gallerySection.style.display = "none";
                modal.classList.add('show');
                document.body.style.overflow = 'hidden';
            }
        }

        function closeModal() {
            modal.classList.remove('show');
            setTimeout(() => { gameFrame.src = ""; }, 300);
            document.body.style.overflow = ''; 
        }

        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeModal();
        });

        function fixWixImage(url) {
            if (!url) return "";
            if (url.includes("wix:image://")) {
                const match = url.match(/wix:image:\/\/v1\/([^/]+)\//);
                if (match && match[1]) return `https://static.wixstatic.com/media/${match[1]}`;
            }
            if (url.startsWith("http")) return url;
            return url;
        }

        Papa.parse("X2R Projects.csv", {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                allProjects = results.data;
                const container = document.getElementById('project-container');
                const countSpan = document.getElementById('project-count');
                container.innerHTML = '';
                countSpan.innerText = allProjects.length;

                allProjects.forEach((row, index) => {
                    const title = row['Project Name'];
                    const category = (row[' Customers'] || row['Customers'] || "Project").replace(/[\[\]]/g, '').trim(); 
                    const desc = row['Short Description'];
                    const image = fixWixImage(row['Title Image']) || "https://via.placeholder.com/400x300";
                    const videoLink = row['Video Link'];
                    const hasVideo = videoLink && videoLink.trim() !== "";
                    const imageAction = hasVideo ? `onclick="openYoutubePopup('${videoLink}')"` : `style="cursor: default;"`;
                    const webglLink = row['WebGL Link']; 
                    const hasGame = webglLink && webglLink.trim() !== "";
                    const animationDelay = (index % 10) * 0.1;
                    const buttonHTML = `<button onclick="openDetail(${index})" class="card-link">View Detail</button>`;

                    const cardHTML = `
                        <article class="project-card" style="animation-delay: ${animationDelay}s">
                            <div class="card-image">
                                <span class="category-tag">${category}</span>
                                <a href="javascript:void(0)" ${imageAction} class="card-image-link">
                                    <img src="${image}" alt="${title}" loading="lazy">
                                    <div class="play-icon" ${hasVideo ? '' : 'style="display:none;"'}>▶</div>
                                </a>
                            </div>
                            <div class="card-content">
                                <h3>${title}</h3>
                                <p>${desc}</p>
                                ${buttonHTML}
                            </div>
                        </article>
                    `;
                    container.innerHTML += cardHTML;
                });
            }
        });
    </script>
</body>
</html>
