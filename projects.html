<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X2R Projects</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        /* =========================================
           1. 공통 스타일
        ========================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
            color: #ffffff; 
            overflow-x: hidden; 
            background-color: transparent;
            line-height: 1.6;
        }

        a { text-decoration: none; color: inherit; transition: all 0.3s; }
        button { cursor: pointer; font-family: inherit; }

        /* 배경 동영상 */
        .video-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; pointer-events: none;
        }
        .video-background iframe {
            width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 0;
        }

        /* 헤더 */
        header {
            position: fixed; top: 0; width: 100%; z-index: 100;
            padding: 20px 40px; display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(10px); background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo {
            display: flex; align-items: center; max-width: 150px; height: auto;
        }
        .logo img { width: 100%; height: auto; }
        .nav-links a { margin-left: 30px; font-size: 0.95rem; font-weight: 500; color: #bbb; }
        .nav-links a.active { color: #fff; font-weight: 700; }
        .nav-links a:hover { color: #fff; }

        /* 레이아웃 */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        .page-header { padding: 150px 0 80px; text-align: center; }
        .page-title {
            font-size: clamp(2.5rem, 5vw, 4.5rem); font-weight: 800; margin-bottom: 20px;
            animation: slideUp 1s ease-out forwards;
        }
        .page-desc {
            font-size: 1.2rem; color: #ccc; max-width: 700px; margin: 0 auto;
            animation: slideUp 1s ease-out 0.2s forwards; opacity: 0;
        }

        /* =========================================
           2. 프로젝트 카드 그리드 스타일
        ========================================= */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 40px; padding-bottom: 150px;
        }

        .project-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.4s;
            backdrop-filter: blur(5px);
            opacity: 0; transform: translateY(30px);
            animation: fadeInCard 0.8s ease-out forwards;
        }

        @keyframes fadeInCard { to { opacity: 1; transform: translateY(0); } }

        .project-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border-color: rgba(59, 130, 246, 0.5);
        }

        /* 이미지 영역 */
        .card-image {
            height: 220px; overflow: hidden; position: relative; z-index: 1; cursor: pointer;
        }
        .card-image img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.6s, filter 0.3s;
        }
        .project-card:hover .card-image img { transform: scale(1.1); filter: brightness(0.7); }

        /* 플레이 아이콘 (게임 패드 모양 등으로 변경 가능) */
        .play-icon {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: 3rem; color: #fff; opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2; text-shadow: 0 2px 10px rgba(0,0,0,0.5); pointer-events: none;
        }
        .project-card:hover .play-icon { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        /* 카테고리 태그 */
        .category-tag {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0, 0, 0, 0.7); padding: 5px 12px;
            border-radius: 20px; font-size: 0.75rem; font-weight: 600; color: #3b82f6;
            backdrop-filter: blur(4px); z-index: 5;
            white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis;
        }

        /* 텍스트 영역 */
        .card-content { padding: 25px; display: flex; flex-direction: column; height: calc(100% - 220px); }
        .card-content h3 { font-size: 1.3rem; margin-bottom: 10px; font-weight: 700; line-height: 1.3; }
        .card-content p {
            font-size: 0.95rem; color: #aaa; margin-bottom: 20px; line-height: 1.5;
            flex-grow: 1;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        
        /* View Detail 버튼 스타일 */
        .card-link {
            font-size: 0.9rem; font-weight: 600; color: #fff;
            background: transparent; border: none; padding: 0;
            display: inline-flex; align-items: center; margin-top: auto;
            text-align: left;
        }
        .card-link::after { content: '→'; margin-left: 8px; transition: margin-left 0.3s; }
        .project-card:hover .card-link::after { margin-left: 12px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* =========================================
           3. WebGL 게임 모달 (팝업) 스타일
        ========================================= */
        .game-modal {
            display: none; /* 기본 숨김 */
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .game-modal.show { display: flex; opacity: 1; }

        .modal-content {
            position: relative;
            width: 90%; max-width: 1280px;
            height: 80%; max-height: 720px;
            background: #000;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            display: flex; flex-direction: column;
        }

        .modal-header {
            padding: 10px 20px;
            display: flex; justify-content: flex-end;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .close-modal {
            background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer;
            line-height: 1; transition: color 0.3s;
        }
        .close-modal:hover { color: #ff4d4d; }

        .game-frame {
            width: 100%; height: 100%; border: none; flex-grow: 1;
        }

        @media (max-width: 768px) {
            .project-grid { grid-template-columns: 1fr; }
            .page-title { font-size: 2.5rem; }
            .modal-content { width: 95%; height: 60%; }
        }
        
        footer { padding: 60px 0; text-align: center; color: #555; border-top: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <div class="video-background">
        <iframe 
            src="https://www.youtube.com/embed/mwyfdKKhhAk?autoplay=1&mute=1&controls=0&loop=1&playlist=mwyfdKKhhAk&playsinline=1" 
            title="YouTube video player" frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            style="pointer-events: none;" allowfullscreen>
        </iframe>
        <div class="overlay"></div>
    </div>

    <header>
        <a href="index.html" class="logo">
            <img src="x2rlogo.png" alt="X2R Logo">
        </a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="history.html">History</a>
            <a href="projects.html" class="active">Projects</a> 
        </nav>
    </header>

    <section class="container page-header">
        <h1 class="page-title">X2R Projects</h1>
        <p class="page-desc">
            총 <span id="project-count">0</span>개의 혁신적인 프로젝트.<br>
            데이터 기반으로 자동 업데이트되는 X2R의 포트폴리오입니다.
        </p>
    </section>

    <section class="container project-grid" id="project-container">
        <div style="text-align:center; width:100%; grid-column: 1/-1; color: #aaa;">
            Loading Projects from CSV...
        </div>
    </section>

    <footer>
        <p>© 2025 X2R Corp. All Rights Reserved.</p>
    </footer>

    <div id="gameModal" class="game-modal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="close-modal" onclick="closeGame()">×</button>
            </div>
            <iframe id="gameFrame" class="game-frame" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // --- WebGL 게임 모달 제어 함수 ---
        const modal = document.getElementById('gameModal');
        const gameFrame = document.getElementById('gameFrame');

        // 게임 열기: url을 받아서 iframe에 넣고 모달을 보여줌
        function openGame(url) {
            if (!url || url.trim() === "") {
                alert("연결된 게임 링크가 없습니다.");
                return;
            }
            gameFrame.src = url;
            modal.classList.add('show');
            document.body.style.overflow = 'hidden'; // 배경 스크롤 막기
        }

        // 게임 닫기: 모달 숨기고 iframe src 초기화 (소리/게임 멈춤)
        function closeGame() {
            modal.classList.remove('show');
            setTimeout(() => {
                gameFrame.src = ""; // 모달이 사라지는 애니메이션 후 src 제거
            }, 300);
            document.body.style.overflow = ''; // 배경 스크롤 복구
        }

        // 모달 배경 클릭 시 닫기
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeGame();
            }
        });


        // --- CSV 데이터 처리 ---
        // 1. Wix 이미지 URL 수정 함수
        function fixWixImage(url) {
            if (!url) return "https://via.placeholder.com/400x300?text=No+Image";
            if (url.includes("wix:image://")) {
                const match = url.match(/wix:image:\/\/v1\/([^/]+)\//);
                if (match && match[1]) {
                    return `https://static.wixstatic.com/media/${match[1]}`;
                }
            }
            if (url.startsWith("http")) return url;
            return url;
        }

        // 2. CSV 파일 불러오기
        Papa.parse("X2R Projects.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const projects = results.data;
                const container = document.getElementById('project-container');
                const countSpan = document.getElementById('project-count');
                
                container.innerHTML = '';
                countSpan.innerText = projects.length;

                projects.forEach((row, index) => {
                    // 데이터 파싱
                    const title = row['Project Name'];
                    const rawCategory = row[' Customers'] || row['Customers'] || "X2R Project";
                    const category = rawCategory.replace(/[\[\]]/g, '').trim(); 
                    const desc = row['Short Description'];
                    const image = fixWixImage(row['Title Image']);
                    
                    // 기존 Video Link 컬럼을 WebGL 게임 경로로 사용한다고 가정
                    // 예: "https://mysite.com/games/project1/index.html" 또는 "game_folder/index.html"
                    const webglLink = row['Video Link'];

                    const hasGame = webglLink && webglLink.trim() !== "";
                    const animationDelay = (index % 10) * 0.1;

                    // onclick 이벤트에 openGame 함수 연결
                    // View Detail 버튼 생성
                    const buttonHTML = hasGame 
                        ? `<button onclick="openGame('${webglLink}')" class="card-link">View Detail</button>` 
                        : `<span class="card-link" style="opacity:0.5; cursor:default;">Coming Soon</span>`;

                    // 이미지 클릭 시에도 동작하도록 설정
                    const imageAction = hasGame ? `onclick="openGame('${webglLink}')"` : '';

                    const cardHTML = `
                        <article class="project-card" style="animation-delay: ${animationDelay}s">
                            <div class="card-image" ${imageAction}>
                                <span class="category-tag">${category}</span>
                                <div class="card-image-link">
                                    <img src="${image}" alt="${title}" loading="lazy">
                                    <div class="play-icon" ${hasGame ? '' : 'style="display:none;"'}>▶</div>
                                </div>
                            </div>
                            <div class="card-content">
                                <h3>${title}</h3>
                                <p>${desc}</p>
                                ${buttonHTML}
                            </div>
                        </article>
                    `;
                    container.innerHTML += cardHTML;
                });
            },
            error: function(err) {
                console.error("CSV Load Error:", err);
                document.getElementById('project-container').innerHTML = 
                    '<p style="text-align:center; color:red;">프로젝트 목록을 불러오지 못했습니다.</p>';
            }
        });
    </script>
</body>
</html>
